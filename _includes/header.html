<!-- Navigation Header -->
<header>
  <div class="container nav-container">
    <a href="{{ '/' | relative_url }}" class="logo-link" id="nav-logo" style="display: flex; align-items: center; gap: 8px;">
      <img src="{{ '/imgs/niyogi_labs_art.png' | relative_url }}" alt="Niyogi Labs Logo" style="width: 24px; height: 24px; object-fit: contain;">
      Niyogi Labs
    </a>
    <button class="mobile-toggle" aria-label="Toggle menu" id="mobile-nav-btn">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav-menu" id="nav-menu-list">
      <li><a href="{{ '/' | relative_url }}" class="nav-link{% if page.active_nav == 'home' %} active{% endif %}" id="nav-link-home">Home</a></li>
      <li><a href="{{ '/butler/' | relative_url }}" class="nav-link{% if page.active_nav == 'butler' %} active{% endif %}" id="nav-link-butler">Butler Platform</a></li>
      <li><a href="{{ '/dutyremind/' | relative_url }}" class="nav-link{% if page.active_nav == 'dutyremind' %} active{% endif %}" id="nav-link-dutyremind">DutyRemind</a></li>
      <li><a href="{{ '/wavebench/' | relative_url }}" class="nav-link{% if page.active_nav == 'wavebench' %} active{% endif %}" id="nav-link-wavebench">WaveBench</a></li>
      <li><a href="{{ '/about/' | relative_url }}" class="nav-link{% if page.active_nav == 'about' %} active{% endif %}" id="nav-link-about">About</a></li>
      <li class="dropdown" id="nav-dropdown-tools">
        <a href="#" class="nav-link dropdown-toggle" id="nav-link-tools">
          Tools
          <svg class="dropdown-caret" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1l4 4 4-4" />
          </svg>
        </a>
        <ul class="dropdown-menu">
          <li><a href="https://skillspector.niyogilabs.com/" class="dropdown-item" id="nav-link-skillspector" target="_blank" rel="noopener">Skill Spector</a></li>
        </ul>
      </li>
      <li style="display: flex; align-items: center;">
        <button class="theme-toggle" aria-label="Toggle light/dark theme" id="theme-toggle-btn" style="background: none; border: none; cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center; padding: 4px; transition: var(--transition-smooth);">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </li>
    </ul>
  </div>
</header>
